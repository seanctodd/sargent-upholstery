name: Fetch Google Reviews

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-commit-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Fetch Google Reviews
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_LOCATION_NAME: ${{ secrets.GOOGLE_LOCATION_NAME }}
        run: go run scripts/fetch-reviews.go
      - name: Commit new reviews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reviews.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Google reviews [automated]"
            git push || (git pull --rebase --autostash origin main && git push)
          fi
