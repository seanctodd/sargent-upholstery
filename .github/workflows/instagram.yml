name: Fetch Instagram Posts

on:
  schedule:
    - cron: '0 10 * * 1'  # Mondays at 10:00 UTC (offset from the reviews job at 09:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-commit-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  fetch-instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Pin the toolchain to go.mod rather than inheriting whatever the runner
      # image happens to ship: this job runs unattended every week, so a runner
      # image change would otherwise break it silently.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fetch Instagram posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: go run ./scripts/fetch-instagram
      - name: Upload Reels to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ ! -d reels ]; then
            echo "No reels/ directory (fetch skipped); nothing to upload."
            exit 0
          fi
          # No --delete on purpose. This step runs before the commit, and the
          # Cloudflare Pages rebuild only starts after it -- so deleting reels
          # that aged out of the top 20 would 404 them on the live site for the
          # minutes in between. Orphans are cheap (a few MB each, well inside
          # the R2 free tier) and nothing links to them once the gallery data
          # no longer references them.
          aws s3 sync reels "s3://sargent-media/reels/" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type video/mp4 \
            --cache-control "public, max-age=604800, immutable"
      - name: Commit updated gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f data/instagram.json ]; then
            echo "No data/instagram.json (fetch skipped or failed); nothing to commit."
            exit 0
          fi
          git add assets/instagram data/instagram.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Instagram gallery [automated]"
            git push || (git pull --rebase --autostash origin main && git push)
          fi
