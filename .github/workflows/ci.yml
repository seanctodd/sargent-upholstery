name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Hugo build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve pinned Hugo version
        id: hugo
        run: |
          version="$(tr -d '[:space:]' < .hugo-version)"
          if [ -z "$version" ]; then
            echo "::error::.hugo-version is empty"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Pinned Hugo version: $version"

      # Install the same official extended binary Cloudflare Pages downloads for
      # HUGO_VERSION, so CI reproduces the deploy toolchain exactly.
      - name: Install Hugo Extended
        env:
          HUGO_VER: ${{ steps.hugo.outputs.version }}
        run: |
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VER}/hugo_extended_${HUGO_VER}_linux-amd64.tar.gz"
          curl -sSfL "$url" -o /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install /tmp/hugo /usr/local/bin/hugo
          hugo version

      # Treat any WARN as a failure. Note --panicOnWarning does NOT cover config
      # deprecations (verified: it logs them and still exits 0), so grep the log
      # instead. This is the guard that catches deprecated config keys such as
      # the minify.tdewolff.css.keepCSS2 one that went unnoticed for months.
      - name: Build (warnings are errors)
        run: |
          set -o pipefail
          hugo --gc --printPathWarnings 2>&1 | tee /tmp/build.log
          if grep -qE '^WARN' /tmp/build.log; then
            echo "::error::Hugo emitted warnings:"
            grep -E '^WARN' /tmp/build.log
            exit 1
          fi

      - name: Sanity-check output
        run: |
          fail=0
          for f in public/index.html public/es/index.html public/gallery/index.html \
                   public/sitemap.xml public/_headers; do
            if [ ! -s "$f" ]; then
              echo "::error::expected build artefact missing or empty: $f"
              fail=1
            fi
          done
          # No content uses taxonomies; these are disabled in hugo.toml and must
          # not reappear in the sitemap as empty pages.
          if grep -qE '<loc>[^<]*/(categories|tags)/</loc>' public/en/sitemap.xml public/es/sitemap.xml; then
            echo "::error::empty taxonomy pages are back in the sitemap"
            fail=1
          fi
          exit $fail

      # Cloudflare Pages merges every matching _headers rule and joins duplicate
      # headers with a comma, so two rules matching one file would emit a
      # malformed Cache-Control. Assert each output path matches at most one.
      - name: Check _headers rules do not overlap
        run: |
          python3 - <<'PY'
          import fnmatch, os, sys
          rules, cur = [], None
          for line in open('public/_headers'):
              s = line.rstrip('\n')
              if not s.strip() or s.lstrip().startswith('#'):
                  continue
              if not s[:1].isspace():
                  cur = s.strip()
              elif cur and s.strip().lower().startswith('cache-control'):
                  rules.append(cur)
          bad = []
          for root, _, files in os.walk('public'):
              for fn in files:
                  p = '/' + os.path.relpath(os.path.join(root, fn), 'public').replace(os.sep, '/')
                  m = [r for r in rules if fnmatch.fnmatch(p, r)]
                  if len(m) > 1:
                      bad.append((p, m))
          if bad:
              for p, m in bad[:20]:
                  print(f"::error::{p} matches multiple Cache-Control rules: {m}")
              sys.exit(1)
          print(f"{len(rules)} Cache-Control rules, no overlaps")
          PY

  test-js:
    name: JS behaviour tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --no-save keeps the repo free of package.json / package-lock.json; the
      # site itself has no npm dependencies and should stay that way.
      - name: Install jsdom
        run: npm install --no-save jsdom --no-fund --no-audit --loglevel=error

      - name: Run tests
        run: node tests/lite-youtube.test.js

  go:
    name: Go scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # go.mod is the single source of truth for the toolchain, the same way
      # .hugo-version is for Hugo.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for: $unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # Covers reconcile() -- the logic that decides when a review stops being
      # displayed. Worth real tests: a false positive hides genuine reviews.
      - name: go test
        run: go test ./...
