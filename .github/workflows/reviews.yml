name: Fetch Google Reviews

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would change without writing or committing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-commit-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Pin the toolchain to go.mod rather than inheriting whatever the runner
      # image happens to ship: this job runs unattended every week, so a runner
      # image change would otherwise break it silently.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fetch Google Reviews
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_LOCATION_NAME: ${{ secrets.GOOGLE_LOCATION_NAME }}
          # `inputs` is empty for scheduled runs, so this is only ever set when
          # someone dispatches the workflow with dry_run checked.
          REVIEWS_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: go run ./scripts/fetch-reviews
      - name: Commit new reviews
        # Skipped on a dry run; true for scheduled runs, where inputs is null.
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reviews.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Google reviews [automated]"
            git push || (git pull --rebase --autostash origin main && git push)
          fi
