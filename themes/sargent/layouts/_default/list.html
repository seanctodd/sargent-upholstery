{{ define "main" }}
<section class="page-hero">
  {{- with .Params.heroImage }}
  <img class="hero-img" src="{{ . | relURL }}" srcset="{{ range $i, $s := partial "hero-srcset.html" . }}{{ if $i }}, {{ end }}{{ $s.url }} {{ $s.w }}w{{ end }}" sizes="100vw" alt="{{ $.Title }}" width="1920" height="1280" fetchpriority="high">
  {{- end }}
  <div class="hero-overlay">
    <div class="container">
      <h1>{{ .Title }}</h1>
    </div>
  </div>
</section>
<section class="page-content">
  <div class="container">
    {{ .Content }}
    {{ range .Pages }}
    <article class="list-item">
      <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </article>
    {{ end }}
  </div>
</section>
{{ end }}
